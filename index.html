tick=function(t){const dt=Math.min(.035,last?(t-last)/1000:0);last=t;S.clock+=dt;L.fade=Math.max(0,L.fade-dt);L.toastTime=0;
 if(S.screen==='play'&&!S.paused&&!S.dialog&&innerWidth>innerHeight){physics(dt);ambientStep(dt);updateDirector(dt);if(workday())dayStep(dt)}if(S.screen==='play')ui();draw();requestAnimationFrame(tick)};

Promise.all(artPromises).then(()=>{for(const scene of ['office','corridor','warehouse','dock','kitchen','locker'])bg[scene]=ART['room_'+scene];enrichMarket();upgradeGraphics();resize();soundUI();start();requestAnimationFrame(tick)}).catch(e=>{menu('<h1>Не удалось подготовить графику</h1><p>Обновите страницу.</p>');console.error(e)});
